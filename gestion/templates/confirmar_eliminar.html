{% extends 'base.html' %}
{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card-cine border-danger shadow">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Confirmar eliminación</h5>
            </div>
            <div class="card-body">
                <p>¿Estás seguro de que deseas eliminar la {{ tipo }} <strong>"{{ objeto }}"</strong>? Esta acción no se puede deshacer.</p>
                <form method="post" class="d-flex justify-content-end gap-2">
                    {% csrf_token %}
                    <a href="{% url url_cancelar %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
