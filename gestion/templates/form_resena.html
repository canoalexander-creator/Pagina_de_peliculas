{% extends 'base.html' %}
{% block title %}Editar Reseña | CineApp{% endblock %}


{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-cine p-4">
            <h4 class="fw-bold text-white mb-1">Editar Reseña</h4>
            <p class="text-secondary small mb-4">Película: <strong>{{ resena.pelicula.titulo }}</strong></p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-light">{{ form.calificacion.label }}</label>
                    {{ form.calificacion }}
                </div>
                <div class="mb-4">
                    <label class="form-label text-light">{{ form.comentario.label }}</label>
                    {{ form.comentario }}
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'detalle_pelicula' resena.pelicula.pk %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-cine">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
