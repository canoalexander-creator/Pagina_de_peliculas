{% extends 'base.html' %}
{% block title %}{{ accion }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-cine shadow">
            <div class="card-header bg-dark border-bottom border-secondary">
                <h4 class="mb-0 text-white">{{ accion }}</h4>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'lista_categorias' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-cine">Guardar Categoría</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
